schema: 1
plugin: ProxyARC verification
minecraft-version: '1.21.11'
minecraft-client-sha1: ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd
gallery-accent: '#92bed8'

resource-pack:
  url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip
  sha256-url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip.sha256

sources:
  discord-verification:
    path: src/main/resources/modules/discord-verification.yml
    root: messages.minecraft.challenge
    include:
      - code-format
      - code-row
      - code-hover
      - code-row-hover
      - copy-hint
      - command-hint
  telegram-verification:
    path: src/main/resources/modules/telegram.yml
    root: identity.minecraft.challenge
    include:
      - code-format
      - code-row
      - code-hover
      - code-row-hover
      - copy-hint
      - command-format
      - command-hover
      - command-hint

placeholders:
  code: ABCD-EFGH
  command: /verify ABCD-EFGH

surfaces:
  chat:
    - source: discord-verification
      include: ['*']
    - source: telegram-verification
      include: ['*']
