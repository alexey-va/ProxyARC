schema: 1
plugin: ProxyARC verification
minecraft-version: '1.21.11'
minecraft-client-sha1: ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd
gallery-accent: '#92bed8'

resource-pack:
  url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip
  sha256-url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip.sha256

custom-items:
  arc:background:
    material: GRAY_STAINED_GLASS_PANE
    model: assets/arc/models/gui/background.json

glyphs:
  - character: ""
    path: "@pack/assets/lzranks/textures/font/rank_icons/discord_icon.png"
    height: 9
    ascent: 8
  - character: ""
    path: "@pack/assets/arc/textures/icons/chat/telegram.png"
    height: 9
    ascent: 8

sources:
  join-catalog:
    path: src/main/resources/modules/join-messages.yml
    root: catalog.join
    include:
      - '*.display-name'
      - '*.message'
  leave-catalog:
    path: src/main/resources/modules/join-messages.yml
    root: catalog.leave
    include:
      - '*.display-name'
      - '*.message'
  discord-minecraft:
    path: src/main/resources/modules/discord-verification.yml
    root: messages.minecraft
    include:
      - identity
  discord-verification:
    path: src/main/resources/modules/discord-verification.yml
    root: messages.minecraft.challenge
    include:
      - layout
      - link-title
      - code-format
      - code-row
      - copy-hint
      - invite-label
      - command-hint
      - expiry
      - minute-many
  telegram-minecraft:
    path: src/main/resources/modules/telegram.yml
    root: identity.minecraft
    include:
      - identity
  telegram-verification:
    path: src/main/resources/modules/telegram.yml
    root: identity.minecraft.challenge
    include:
      - layout
      - title
      - code-format
      - code-row
      - copy-hint
      - bot-link-label
      - command-format
      - command-hint
      - expiry
      - minute-many
  portal-outbound:
    path: src/main/resources/modules/portal-bridge.yml
    root: outbound
    include:
      - minecraft-format

placeholders:
  player_name: Alexey23
  code: ABCD-EFGH
  command: /verify ABCD-EFGH
  minutes: 10
  message: Привет с сайта!

