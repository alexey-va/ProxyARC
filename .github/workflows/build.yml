name: build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: standalone unit and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew --build-cache test build

  mysql-integration:
    name: MySQL vote integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify Docker daemon
        run: docker info
      - run: ./gradlew --no-daemon integrationTest

  velocity-e2e:
    name: Real Velocity callbacks and durable replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: proxyarc_e2e
          MYSQL_USER: proxyarc_e2e
          MYSQL_PASSWORD: proxyarc-disposable-e2e-mysql
          MYSQL_ROOT_PASSWORD: proxyarc-disposable-e2e-root
        ports:
          - 33316:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew --build-cache shadowJar
      - name: Exercise actual Velocity plugin and MySQL
        env:
          E2E_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: python3 -u src/test/e2e/run_velocity.py
      - name: Retain Velocity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxyarc-velocity-e2e
          retention-days: 7
          path: |
            build/velocity-e2e-*/*.log
            build/velocity-e2e-*/logs/
      - name: Retain tested ProxyARC plugin
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxyarc-velocity-tested-jar
          retention-days: 7
          path: build/libs/ProxyARC.jar
