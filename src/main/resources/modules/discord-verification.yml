# Portable defaults. RusCrafting production ids live in the tracked runtime mirror.
enabled: false
guild-id: "none"

codes:
  length: 8
  ttl-seconds: 600
  issue-cooldown-seconds: 60
  issue-window-seconds: 600
  max-issues-per-window: 3
  attempt-window-seconds: 600
  max-attempts-per-window: 5

# A verification command is accepted only after the player reached a real backend.
allowed-backends:
  - "spawn"
  - "survival"
  - "parkour"
  - "end"
  - "etd"

roles:
  verified-role-id: "none"
  player-role-id: "none"
  nickname-enabled: true
  nickname-format: "%player_name%"

  policies:
    # Policies are discovered by key. To retire one safely, first set enabled: false,
    # let reconciliation remove the role, and only then delete the whole policy block.
    vip:
      enabled: true
      role-id: "none"
      groups:
        - "vip"
        - "supervip"
      permissions:
        - "arc.vip"
    administration:
      enabled: true
      role-id: "none"
      groups:
        - "admin"
        - "moderator"
      permissions: []
    helper:
      enabled: true
      role-id: "none"
      groups:
        - "helper"
      permissions: []

sync:
  interval-seconds: 300
  luckperms-events-enabled: true
  event-debounce-millis: 1000
  event-suppression-seconds: 5

messages:
  identity: "Discord"
  invite-url: ""

  # MiniMessage. Dynamic values use non-parsing tags such as <player_name> and <minutes>.
  minecraft:
    format: "<#92bed8><identity> <#666666>• <message>"
    only-player: "<#c42323>Только для игроков."
    unavailable: "<#c42323>Проверка Discord временно недоступна."
    backend-required: "<#ff9f0f>Сначала войдите на игровой сервер."
    usage: "<#ff9f0f>/verify [status|recover|unlink confirm]"
    issue-failed-unchanged: "<#c42323>Сервис недоступен. Данные не изменены."
    already-linked: "<#e6fff3>Уже связан. Перенос: <#92bed8>/verify recover<#e6fff3>."
    recovery-not-linked: "<#e6fff3>Аккаунт не связан. Используйте <#92bed8>/verify<#e6fff3>."
    rate-limited: "<#ff9f0f>Новый код можно получить через <minutes> мин."
    issue-failed-saved: "<#c42323>Сервис недоступен. Данные сохранены."
    status-not-linked: "<#e6fff3>Discord-аккаунт не связан."
    status-linked: "<#2bba43>Связан: <player_name>."
    unlink-failed-retry: "<#c42323>Не удалось отвязать. Повторите позже."
    unlink-success: "<#2bba43>Аккаунт отвязан, управляемые роли сняты."
    unlink-not-linked: "<#e6fff3>Discord-аккаунт не связан."
    unlink-role-failure: "<#c42323>Не удалось снять роли. Отвязка отменена."
    unlink-failed-saved: "<#c42323>Не удалось отвязать. Данные сохранены."
    admin-no-permission: "<#c42323>Недостаточно прав для управления Discord-привязками."
    admin-unavailable: "<#c42323>Управление Discord-привязками временно недоступно."
    admin-usage: "<#e6fff3>Команды администратора:<newline>  <#666666>• <#92bed8>/proxyarc discord status [аккаунт]<newline>  <#666666>• <#92bed8>/proxyarc discord sync [аккаунт]<newline>  <#666666>• <#92bed8>/proxyarc discord unlink [аккаунт] confirm"
    admin-invalid-query: "<#c42323>Укажите игровой ник, UUID или Discord ID."
    admin-not-linked: "<#e6fff3>Привязка для <#92bed8><query><#e6fff3> не найдена."
    admin-ambiguous-query: "<#ff9f0f>Ник найден в нескольких привязках.<newline>  <#969696>Используйте UUID или Discord ID."
    admin-sync-success: "<#2bba43>Роли <player_name>: <status>."
    admin-sync-failed: "<#c42323>Роли <player_name> не синхронизированы.<newline>  <#666666>• <#8c8c8c><status>: <#e6fff3><reason>"
    admin-unlink-confirm: "<#ff9f0f>Подтвердите отвязку:<newline>  <#666666>• <#92bed8>/proxyarc discord unlink <query> confirm"
    admin-unlink-success: "<#2bba43>Привязка <player_name> удалена, управляемые роли сняты."
    admin-unlink-role-failure: "<#c42323>Отвязка отменена: роли не сняты.<newline>  <#666666>• <#8c8c8c><status>: <#e6fff3><reason>"
    admin-unlink-failed: "<#c42323>Не удалось безопасно удалить привязку. Данные сохранены."
    admin-conflict: "<#ff9f0f>Привязка изменилась во время операции. Повторите команду."

    admin:
      status-layout:
        - ""
        - "  <title>"
        - "  <minecraft>"
        - "  <uuid>"
        - "  <discord>"
        - "  <sync>"
        - "  <age>"
        - "  <reason>"
        - ""
      status-title: "<#92bed8><bold>Диагностика Discord</bold>"
      status-minecraft: "<#8c8c8c>Minecraft: <#e6fff3><player_name>"
      status-uuid: "<#8c8c8c>UUID: <#969696><player_uuid>"
      status-discord: "<#8c8c8c>Discord ID: <#969696><discord_id>"
      status-sync: "<#8c8c8c>Роли: <#e6fff3><status> <#666666>• <#969696><trigger>"
      status-sync-never: "<#8c8c8c>Роли: <#969696>ещё не синхронизировались"
      status-age: "<#8c8c8c>Последняя попытка: <#969696><seconds> сек. назад"
      status-reason: "<#8c8c8c>Причина: <#e6fff3><reason>"
      status-reason-none: "<#8c8c8c>Причина: <#969696>нет"

    challenge:
      # Empty first/last rows frame this rare important message; visible rows keep two spaces.
      layout:
        - ""
        - "  <title>"
        - ""
        - "  <code_row>"
        - "  <copy_hint>"
        - ""
        - "  <invite_link>"
        - "  <command_hint>"
        - "  <input_hint>"
        - ""
        - "  <expiry>"
        - ""
      link-title: "<#92bed8><bold>Привязка Discord-аккаунта</bold>"
      recovery-title: "<#92bed8><bold>Перенос привязки Discord</bold>"
      code-format: "<#ffacd5><bold><code></bold>"
      code-row: "<#8c8c8c>Код для Discord: <code>"
      code-hover: "<#969696>Нажмите, чтобы скопировать"
      code-row-hover: "<#969696>Скопировать код"
      copy-hint: "<#969696>Нажмите строку — код скопируется."
      invite-label: "<#92bed8><bold><underlined>Открыть Discord RusCrafting</underlined></bold>"
      invite-hover: "<#969696>Перейти на сервер RusCrafting"
      command-hint: "<#e6fff3>В Discord введите <#92bed8>/verify"
      input-hint: "<#e6fff3>В поле code вставьте скопированный код."
      expiry: "<#969696>Код действует <minutes> <minute_word>."
      minute-one: "минуту"
      minute-few: "минуты"
      minute-many: "минут"

  # Plain Discord text. Dynamic values use %player_name% and %minutes%.
  discord:
    format: "%identity% • %message%"
    commands:
      verify-description: "Связать Discord с аккаунтом Minecraft"
      verify-code-description: "Одноразовый код из команды /verify на игровом сервере"
      unlink-description: "Отвязать аккаунт Minecraft"
      unlink-confirm-description: "Подтвердить отвязку"
    verification-unavailable-saved: "Проверка временно недоступна. Данные сохранены."
    status-not-linked: "Аккаунт не связан. Зайдите на сервер и получите код командой /verify."
    status-linked: "Связан аккаунт Minecraft: %player_name%."
