    verified-role-sync-failed: "Связь с %player_name% сохранена, но роли пока не синхронизированы."
    recovered: "Доступ к аккаунту %player_name% восстановлен."
    recovered-nickname-skipped: "Доступ к аккаунту %player_name% восстановлен. Роли синхронизированы, ник не изменён из-за иерархии Discord."
    recovered-role-sync-failed: "Доступ к %player_name% восстановлен, но роли пока не синхронизированы."
    unlinked: "Аккаунт отвязан. Управляемые роли сняты."
    rate-limited: "Слишком много попыток. Повторите через %minutes% мин."
