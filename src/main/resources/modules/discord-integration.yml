# Account commands, opt-in notifications, moderation alerts, presence and game events.
# Runtime ids are intentionally unset in the bundled default.
enabled: false
guild-id: "none"

channels:
  status: "none"
  alerts: "none"
  announcements: "none"

presence:
  enabled: true
  format: "%online% игроков • play.rus-crafting.ru"
  refresh-seconds: 60

notifications:
  # Per-user categories are opt-in and start disabled.
  max-per-minute: 8

events:
  participant-role-id: "none"
  winner-role-id: "none"
  reminder-minutes:
    - "60"
    - "15"

recovery:
  # Creates a bounded staff-reviewed LimboAuth request; never changes the DB itself.
  request-ttl-seconds: 1800
  # A Discord-link transfer waits so the previously linked account can cancel it.
  link-protection-delay-seconds: 60

