# Website mirror and authenticated outbound chat. Keep the bearer token identical to
# PORTAL_BRIDGE_TOKEN on the website API host and outside committed production config.
enabled: false
base-url: "https://rus-crafting.ru"
bridge-token: ""
presence-interval: 60s
identity-interval: 30s
outbound:
  poll-interval: 2s
  minecraft-format: "<dark_aqua>Сайт</dark_aqua> <dark_gray>| <gray>%player_name% <dark_gray>» <white>%message%"
  external-format: "%player_name% » %message%"
connect-timeout: 5s
request-timeout: 8s
max-in-flight: 32
