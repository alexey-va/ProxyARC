# Финальный сетевой фильтр command tree после объединения backend и proxy.
enabled: true
bypass-permission: "arc.command.hide.bypass"
hide-namespaced-roots: true

# Узкие корни плагинов, которые регистрируются без root-permission и поэтому
# могут быть добавлены после backend PlayerCommandSendEvent.
hidden-roots:
  - "world"
  - "worlds"
  - "myworlds"
  - "my_worlds"
  - "mw"
  - "mv"
  - "litebans"
  - "lbans"

  # Технические корни, которые владелец решил убрать из подсказок игроков.
  # Игровые arc/builder/cmi/hack и выбранные Slimefun-addon команды остаются.
  - "br"
  - "brush"
  - "desel"
  - "deselect"
  - "sel"
  - "toggleplace"
  - "none"
  - "pos"
  - "tool"
  - "auth"
  - "botfilter"
  - "limboauth"
  - "limbofilter"
  - "luckpermsvelocity"
  - "lpv"
  - "planbungee"
  - "planproxy"
  - "planvelocity"
  - "creative"
  - "god"
  - "ungod"
  - "heal"
  - "tangledmaze"
  - "maze"
  - "gravesx"
