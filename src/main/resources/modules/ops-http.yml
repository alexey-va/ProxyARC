# ProxyARC ops HTTP template. Set token only in the protected runtime config.
enabled: true
bind-host: 127.0.0.1
bind-port: 25825
token: ""

simulate-enabled: true
logs-enabled: true

# Discord ops stay disabled until the runtime config explicitly selects channels.
discord-read-enabled: false
discord-write-enabled: false
discord-allowed-channel-ids: []
discord-write-channel-ids: []
discord-max-history: 50
