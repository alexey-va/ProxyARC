# ProxyARC ops HTTP template. Set token only in the protected runtime config.
enabled: true
bind-host: 127.0.0.1
bind-port: 25825
token: ""

simulate-enabled: true
logs-enabled: true

# Discord ops stay disabled until the runtime config explicitly selects guilds/channels.
# A single "*" entry enables every guild/channel visible to the bot.
discord-read-enabled: false
discord-write-enabled: false
discord-admin-enabled: false
discord-allowed-guild-ids: []
discord-allowed-channel-ids: []
discord-write-channel-ids: []
discord-max-history: 50

# Telegram ops are independent from the bridge destinations and deny by default.
# Use exact signed numeric chat/channel ids. Bot API cannot create a Telegram channel;
# create it in Telegram, add the bot as administrator, then manage messages, metadata,
# default permissions, forum topics and invite links through the documented routes.
telegram-read-enabled: false
telegram-write-enabled: false
telegram-admin-enabled: false
telegram-allowed-chat-ids: []
telegram-write-chat-ids: []
telegram-admin-chat-ids: []
