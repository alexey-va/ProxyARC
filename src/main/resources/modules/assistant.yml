# Скорен assistant scenarios. Prompts: prompts/chat.txt, bug-ticket.txt, router.txt
# LLM API: modules/llm.yml
#
# OpenRouter model suffix @preset/deepseek — routing preset (latency priority) from dashboard.
#
# In-game global chat = CMI ! prefix:
#   Locale_RU shoutPrefix: &6Ⓖ &7
#   Chat.yml GeneralFormat: %luckperms_suffix% &7{name} &8» &f{msg}

routing:
  enabled: true
  prefilter-enabled: true
  model: deepseek/deepseek-v4-flash@preset/deepseek
  fallback-model: deepseek/deepseek-v4-pro@preset/deepseek
  temperature: 0
  max-tokens: 256
  max-context-lines: 8
  max-route-history: 3
  timeout-sec: 15
  log-level-skip-debug: true
  log-route-info: true
  context:
    recent-open-tickets: 1
  enabled-intents:
    - chat
    - bug

chat:
  enabled: true
  # Never answer minutes later after provider congestion. A newer queued message
  # from the same player replaces their older not-yet-started chat request.
  max-pending-jobs: 2
  max-queue-age-sec: 15
  max-consecutive-replies: 2
  model: deepseek/deepseek-v4-flash@preset/deepseek
  temperature: 1.0
  max-tokens: 512
  max-history: 12
  compact-threshold: 10
  compact-keep-recent: 6
  observe-all-chat: true
  observe-max-lines: 12
  observe-format: "[%time% %delta%] %player% » %message%"
  observe-context-header: "chat context (time, +Xs after Скорен):"
  continuation-window-sec: 90
  multi-message-delay-ms: 1000
  context:
    trigger-enabled: true
    trigger-header: "current message:"
  memory:
    enabled: true
    storage-key: arc.ai.assistant.facts
    min-confidence: 0.5
    max-injected: 8
    prompt-header: "remembered facts (rememberfact/forgetfact):"
  tools:
    - rememberfact
    - forgetfact
  private-message-format: "&7[%name%] &f%message%"
  display-name: "Скорен"
  shout-prefix: "&6Ⓖ &7"
  suffix: "&f"
  message-format: "%shout%%suffix% &7%name% &8» &f%message%"
  max-message-length: 70
  discord-inbound: true
  relay-discord: true
  relay-telegram: true

bug:
  enabled: true
  # Observe and route bug reports for diagnostics, but never run the bug agent,
  # survey, ticket tools, or send player-facing messages.
  observe-only: true
  max-pending-jobs: 4
  max-queue-age-sec: 60
  # One PM per inbound message is enforced by ToolChainState. Cross-message
  # cooldown is off so a quick survey answer still receives acknowledgement.
  pm-cooldown-sec: 0
  skip-notify-pm:
    enabled: false
  model: deepseek/deepseek-v4-flash@preset/deepseek
  temperature: 0.3
  max-tokens: 1024
  survey:
    enabled: true
    timeout-minutes: 10
    global-inquiry-window-sec: 300
  tools:
    - createissueticket
    - updateissueticket
    - sendprivatemessage
    - sendglobalmessage
    - listissuetickets
  context:
    trigger-enabled: true
    trigger-header: "current message (bug):"
    sync-enabled: true
    sync-interval-sec: 300
    recent-tickets-enabled: true
    recent-tickets: 3
    open-ticket-enabled: true
    recent-chat-enabled: true
    recent-chat-lines: 6

bug-survey:
  enabled: true
  max-pending-jobs: 4
  max-queue-age-sec: 60
  pm-cooldown-sec: 0
  model: deepseek/deepseek-v4-flash@preset/deepseek
  temperature: 0.3
  max-tokens: 1024
  max-history: 8
  compact-threshold: 6
  compact-keep-recent: 4
  survey-turn-keep-history: 6
  tools:
    - createissueticket
    - updateissueticket
    - sendprivatemessage
    - sendglobalmessage
    - listissuetickets
    - completebugsurvey
